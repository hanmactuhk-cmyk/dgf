name: Build HN38 Video AI Tool

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project structure
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host " KIEM TRA PROJECT"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "ROOT:"
          Get-ChildItem -Force

          if (!(Test-Path "desktop")) {
              throw "Khong tim thay thu muc desktop"
          }

          if (!(Test-Path "desktop\main.py")) {
              throw "Khong tim thay desktop\main.py"
          }

          if (!(Test-Path "Hn38videoAItool.spec")) {
              throw "Khong tim thay Hn38videoAItool.spec"
          }

          if (!(Test-Path "requirements")) {
              throw "Khong tim thay requirements"
          }

          Write-Host ""
          Write-Host "OK - CAU TRUC PROJECT HOP LE"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements
          pip install pyinstaller

      - name: Check PyInstaller
        shell: pwsh
        run: |
          python --version
          pyinstaller --version

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean Hn38videoAItool.spec

      - name: Check build output
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host " KIEM TRA BUILD"
          Write-Host "========================================"

          if (!(Test-Path "dist")) {
              throw "Khong co thu muc dist"
          }

          Get-ChildItem "dist" -Recurse

          if (!(Test-Path "dist\Hn38videoAItool.exe")) {
              throw "Khong tim thay Hn38videoAItool.exe"
          }

          Write-Host ""
          Write-Host "BUILD THANH CONG!"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Hn38videoAItool-Windows
          path: dist/Hn38videoAItool.exe
          if-no-files-found: error
