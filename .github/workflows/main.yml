name: Build HN38 Video AI Tool

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # ==============================
      # 1. Lấy source code
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 2. Cài Python
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==============================
      # 3. Kiểm tra cấu trúc project
      # ==============================
      - name: Check project structure
        shell: pwsh
        run: |
          Write-Host "================================="
          Write-Host " KIEM TRA PROJECT"
          Write-Host "================================="

          Write-Host ""
          Write-Host "Root:"
          Get-ChildItem -Force

          Write-Host ""
          Write-Host "Desktop:"
          if (Test-Path "desktop") {
              Get-ChildItem "desktop" -Recurse
          } else {
              throw "Khong tim thay thu muc desktop"
          }

          Write-Host ""
          Write-Host "Kiem tra file can thiet..."

          if (!(Test-Path "desktop\main.py")) {
              throw "Khong tim thay desktop\main.py"
          }

          if (!(Test-Path "Hn38videoAItool.spec")) {
              throw "Khong tim thay Hn38videoAItool.spec"
          }

          if (!(Test-Path "requirements")) {
              throw "Khong tim thay requirements"
          }

          Write-Host ""
          Write-Host "OK - Cau truc project hop le."

      # ==============================
      # 4. Cài dependencies
      # ==============================
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          Write-Host "Cai dependencies tu requirements..."
          pip install -r requirements

          Write-Host "Cai PyInstaller..."
          pip install pyinstaller

      # ==============================
      # 5. Build EXE
      # ==============================
      - name: Build EXE
        shell: pwsh
        run: |
          Write-Host "================================="
          Write-Host " BUILD HN38 VIDEO AI TOOL"
          Write-Host "================================="

          pyinstaller `
            --noconfirm `
            --clean `
            Hn38videoAItool.spec

      # ==============================
      # 6. Kiểm tra file EXE
      # ==============================
      - name: Check build output
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================================="
          Write-Host " KIEM TRA FILE BUILD"
          Write-Host "================================="

          if (Test-Path "dist") {
              Get-ChildItem "dist" -Recurse
          } else {
              throw "Thu muc dist khong duoc tao"
          }

          if (!(Test-Path "dist\Hn38videoAItool.exe")) {
              throw "Khong tim thay dist\Hn38videoAItool.exe"
          }

          Write-Host ""
          Write-Host "BUILD THANH CONG!"
          Write-Host "File: dist\Hn38videoAItool.exe"

      # ==============================
      # 7. Upload EXE
      # ==============================
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Hn38videoAItool-Windows
          path: dist/Hn38videoAItool.exe
          if-no-files-found: error
