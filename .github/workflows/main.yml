name: Build HN38 Video AI Tool

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check project structure
        shell: pwsh
        run: |
          Write-Host "=== PROJECT STRUCTURE ==="
          Get-ChildItem -Force

          if (!(Test-Path "desktop\main.py")) {
            throw "desktop\main.py không tồn tại"
          }

          if (!(Test-Path "Hn38videoAItool.spec")) {
            throw "Hn38videoAItool.spec không tồn tại"
          }

          if (!(Test-Path "requirements")) {
            throw "requirements không tồn tại"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean Hn38videoAItool.spec

      - name: Check build output
        shell: pwsh
        run: |
          Write-Host "=== DIST ==="

          if (Test-Path "dist") {
            Get-ChildItem "dist" -Recurse
          }

          if (!(Test-Path "dist\Hn38videoAItool.exe")) {
            throw "Không tạo được Hn38videoAItool.exe"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hn38videoAItool-Windows
          path: dist/Hn38videoAItool.exe
          if-no-files-found: error
